services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev
    container_name: codelyne-app
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-5000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/codelyne}
      SESSION_SECRET: ${SESSION_SECRET:-local-dev-session-secret-change-me}
      SITE_URL: ${SITE_URL:-http://localhost:5000}
      VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:5000}
      SETUP_KEY: ${SETUP_KEY:-local-dev-setup-key}
      LIVE_BASE_URL: ${LIVE_BASE_URL:-https://codelyne-website-v-2.replit.app}
      SEED_FROM_LIVE: ${SEED_FROM_LIVE:-1}
      FORCE_SEED_FROM_LIVE: ${FORCE_SEED_FROM_LIVE:-0}
      PUBLIC_OBJECT_SEARCH_PATHS: ${PUBLIC_OBJECT_SEARCH_PATHS:-}
      PRIVATE_OBJECT_DIR: ${PRIVATE_OBJECT_DIR:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../:/app
      - app_node_modules:/app/node_modules
    command: sh -c "npm install && npm run db:push && npx tsx scripts/seed-from-live.ts && npm run dev"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: codelyne-db
    environment:
      POSTGRES_DB: codelyne
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codelyne"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
  app_node_modules:
